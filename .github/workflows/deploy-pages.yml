name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate lockfile when missing
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Run frontend protocol tests
        run: npm test
      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_OIDC_ISSUER: ${{ vars.VITE_OIDC_ISSUER }}
          VITE_OIDC_CLIENT_ID: ${{ vars.VITE_OIDC_CLIENT_ID }}
          VITE_OIDC_REDIRECT_URI: ${{ vars.VITE_OIDC_REDIRECT_URI }}
          VITE_DEMO_MODE: "false"
        run: |
          if [ -z "$VITE_API_BASE_URL" ]; then
            echo "::warning::Repository variable VITE_API_BASE_URL is not configured; live API calls will remain unavailable."
          fi
          if [ -z "$VITE_OIDC_ISSUER" ]; then
            echo "::warning::Repository variable VITE_OIDC_ISSUER is not configured; Keycloak login will remain unavailable."
          fi
          npm run build
      - name: Verify published branding assets
        run: |
          test -s dist/logo.svg
          grep -q 'logo.svg' dist/index.html
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(web): add reproducible npm lockfile"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test published Pages assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-all-errors "${PAGE_URL}logo.svg" -o /tmp/pea-logo.svg
          test -s /tmp/pea-logo.svg
