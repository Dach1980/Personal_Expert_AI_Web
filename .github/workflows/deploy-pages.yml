name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify committed lockfile
        run: test -s package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run frontend protocol tests
        run: npm test
      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_OIDC_ISSUER: ${{ vars.VITE_OIDC_ISSUER }}
          VITE_OIDC_CLIENT_ID: ${{ vars.VITE_OIDC_CLIENT_ID }}
          VITE_OIDC_REDIRECT_URI: ${{ vars.VITE_OIDC_REDIRECT_URI }}
          VITE_DEMO_MODE: "true"
        run: |
          if [ "$VITE_DEMO_MODE" != "true" ] && [ -z "$VITE_API_BASE_URL" ]; then
            echo "::warning::Repository variable VITE_API_BASE_URL is not configured; live API calls will remain unavailable."
          fi
          if [ "$VITE_DEMO_MODE" != "true" ] && [ -z "$VITE_OIDC_ISSUER" ]; then
            echo "::warning::Repository variable VITE_OIDC_ISSUER is not configured; Keycloak login will remain unavailable."
          fi
          echo "Frontend demo mode: $VITE_DEMO_MODE"
          npm run build
      - name: Prepare GitHub Pages SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Verify published branding assets
        run: |
          test -s dist/logo.svg
          grep -q 'logo.svg' dist/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test published Pages site and assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-all-errors "${PAGE_URL}" -o /tmp/pea-index.html
          test -s /tmp/pea-index.html
          if grep -q '%BASE_URL%' /tmp/pea-index.html; then
            echo "::error::Unresolved Vite BASE_URL placeholder in deployed index.html"
            exit 1
          fi
          curl --fail --silent --show-error --location --retry 10 --retry-delay 5 --retry-all-errors "${PAGE_URL}logo.svg" -o /tmp/pea-logo.svg
          test -s /tmp/pea-logo.svg
          for route in projects knowledge settings admin; do
            curl --silent --show-error --location --retry 3 --retry-delay 2 "${PAGE_URL}${route}" -o "/tmp/pea-${route}.html"
            grep -q 'id="root"' "/tmp/pea-${route}.html"
          done
          PAGE_URL="${PAGE_URL}" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('/tmp/pea-index.html', 'utf8');
          const pageUrl = process.env.PAGE_URL;
          const refs = [...html.matchAll(/(?:src|href)="([^"]+)"/g)]
            .map((match) => match[1])
            .filter((ref) => /^\/Personal_Expert_AI_Web\/.*\.(?:js|css)(?:\?|$)/.test(ref));
          if (!refs.some((ref) => /\.js(?:\?|$)/.test(ref))) {
            throw new Error('No deployed JavaScript bundle found in index.html');
          }
          for (const ref of refs) {
            const response = await fetch(new URL(ref, pageUrl));
            if (!response.ok) throw new Error(`Asset request failed: ${ref} (${response.status})`);
          }
          console.log(`Verified homepage, logo and ${refs.length} JS/CSS assets`);
          NODE
